<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Syris Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Parisienne&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">Syris Cafe</a>
    <input type="checkbox" id="menu-toggle" aria-label="Toggle navigation">
    <label for="menu-toggle" class="burger"><span></span><span></span><span></span></label>
    <nav>
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/about">About</a>
      <a href="/contact" class="active">Contact</a>
    </nav>
  </header>

    <main>
    <section class="wrap split">
      <img class="side-img" src="https://media.istockphoto.com/id/1201811891/photo/a-cup-of-coffee-with-heart-pattern.jpg?s=612x612&w=0&k=20&c=b0PSjK3IgRssauncP2ND2deVyxXJVQvF0ostqW-5UqM=" alt="Contact Syris Cafe">
      <div class="panel">
        <h2 class="title left">Contact Us</h2>
        <p>Have a question, a cake order, or just want to tell us your favorite drink? Leave us a note.</p>
        <form id="contact-form">
          <label for="name">Name</label>
          <input id="name" type="text" required>
          <label for="email">Email</label>
          <input id="email" type="email" required>
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
          <button class="btn" type="submit">Send message</button>
          <p class="note" id="form-note" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>Sip softly, stay a while.</footer>
  <script src="/js/contact.js"></script>
</body>
</html>
